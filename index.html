<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxibot — Assistente do Representante</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2264%22%20fill%3D%22%231f6f78%22/%3E%0A%3Crect%20x%3D%2260%22%20y%3D%2228%22%20width%3D%228%22%20height%3D%2218%22%20rx%3D%224%22%20fill%3D%22%23e8f0f1%22/%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2224%22%20r%3D%227%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2232%22%20y%3D%2246%22%20width%3D%2264%22%20height%3D%2250%22%20rx%3D%2216%22%20fill%3D%22%23ffffff%22/%3E%0A%3Ccircle%20cx%3D%2252%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%231f6f78%22/%3E%0A%3Ccircle%20cx%3D%2276%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2246%22%20y%3D%2288%22%20width%3D%2236%22%20height%3D%227%22%20rx%3D%223.5%22%20fill%3D%22%231f6f78%22%20opacity%3D%220.55%22/%3E%0A%3Crect%20x%3D%2220%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3Crect%20x%3D%2298%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3C/svg%3E">
<style>
  :root{
    --bg:#f0ede6;
    --card:#ffffff;
    --primary:#1f6f78;
    --primary-dark:#154e55;
    --accent-soft:#e7f0f1;
    --warm:#e08e45;
    --warm-dark:#c4762f;
    --warm-soft:#fbeee0;
    --bot-bubble:#f2f5f5;
    --text:#22282c;
    --text-soft:#6b7680;
    --border:#e8e4dc;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:0;
  }
  .card{
    width:100%;
    max-width:none;
    height:100vh;
    max-height:none;
    background:var(--card);
    border-radius:0;
    box-shadow:none;
    display:flex;
    overflow:hidden;
  }

  /* ===== Sidebar ===== */
  .sidebar{
    width:200px;
    flex-shrink:0;
    background:var(--primary-dark);
    color:#fff;
    display:flex;
    flex-direction:column;
    padding:22px 0;
  }
  .sidebar-brand{
    padding:0 18px 18px;
    border-bottom:1px solid rgba(255,255,255,.12);
    margin-bottom:14px;
  }
  .sidebar-brand img{
    width:52px;height:52px;border-radius:50%;
    display:block; margin-bottom:10px;
    border:2px solid rgba(255,255,255,.35);
  }
  .sidebar-brand .name{font-size:.95rem; font-weight:700;}
  .sidebar-brand .role{font-size:.72rem; color:#bcd8da; margin-top:2px;}
  .sidebar h2{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:#8fb9bc;
    margin:6px 18px 8px;
    font-weight:700;
  }
  .sidebar-list{
    overflow-y:auto;
    flex:1;
    padding:0 10px;
  }
  .side-btn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#e4f0f1;
    padding:9px 10px;
    border-radius:9px;
    font-size:.79rem;
    cursor:pointer;
    margin-bottom:2px;
    line-height:1.3;
  }
  .side-btn:hover{background:rgba(255,255,255,.1);}

  @media (max-width:640px){
    .sidebar{
      position:fixed;
      left:0; top:0; bottom:0;
      z-index:20;
      transform:translateX(-100%);
      transition:transform .25s ease;
      box-shadow:10px 0 30px rgba(0,0,0,.2);
    }
    .sidebar.open{transform:translateX(0);}
    .card{max-width:100%; height:100vh; max-height:none; border-radius:0;}
    body{padding:0;}
  }

  /* ===== Chat column ===== */
  .chat-col{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  header{
    background:var(--primary);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .menu-btn{
    display:none;
    background:rgba(255,255,255,.16);
    border:none;
    color:#fff;
    width:34px;height:34px;
    border-radius:9px;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
  }
  @media (max-width:640px){ .menu-btn{display:block;} }
  .avatar-img{
    width:42px;height:42px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.5);
    flex-shrink:0;
  }
  .header-text{flex:1; min-width:0;}
  header h1{margin:0; font-size:1rem; font-weight:700;}
  .status{
    display:flex;align-items:center;gap:6px;
    font-size:.75rem;
    color:#d3ecee;
    margin-top:2px;
  }
  .status .dot{width:7px;height:7px;border-radius:50%; background:#6be3a3; display:inline-block;}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:20px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:2px;
    background:
      radial-gradient(circle at 15% 0%, #f7fbfb 0%, var(--bg) 55%);
  }
  .row{display:flex; align-items:flex-end; gap:8px; margin:7px 0;}
  .row.user{justify-content:flex-end;}
  .row .mini-avatar{
    width:28px;height:28px;
    border-radius:50%;
    flex-shrink:0;
    border:1.5px solid #fff;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .row.miss .mini-avatar{filter:saturate(.5);}
  .bubble-wrap{display:flex; flex-direction:column; max-width:76%;}
  .row.user .bubble-wrap{align-items:flex-end;}
  .bubble{
    padding:12px 15px;
    border-radius:17px;
    font-size:.91rem;
    line-height:1.55;
  }
  .row.bot .bubble{background:var(--bot-bubble); border-bottom-left-radius:5px;}
  .row.miss .bubble{background:#fbeeec; color:#7a3a30; border-bottom-left-radius:5px;}
  .row.user .bubble{background:var(--warm); color:#fff; border-bottom-right-radius:5px;}
  .timestamp{font-size:.68rem; color:var(--text-soft); margin-top:4px; padding:0 4px;}

  .bubble h3{margin:0 0 6px; font-size:.95rem; color:var(--primary-dark);}
  .bubble ol, .bubble ul{margin:6px 0; padding-left:20px;}
  .bubble .note{
    margin-top:8px; padding:8px 10px;
    background:var(--warm-soft); color:var(--warm-dark);
    border-radius:8px; font-size:.82rem;
  }
  .bubble .rephrase-tag{
    display:inline-block; font-size:.72rem; font-weight:700;
    color:var(--primary); background:var(--accent-soft);
    padding:2px 9px; border-radius:20px; margin-bottom:8px;
  }
  .typing-row .bubble{display:flex; gap:4px; align-items:center; padding:12px 16px;}
  .typing-dot{width:6px;height:6px;border-radius:50%; background:var(--text-soft); animation:blink 1.2s infinite ease-in-out;}
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  form{
    display:flex; gap:8px;
    padding:14px 18px;
    border-top:1px solid var(--border);
    background:var(--card);
  }
  input[type=text]{
    flex:1; border:1px solid var(--border); background:var(--bg);
    border-radius:22px; padding:11px 16px; font-size:.9rem; outline:none;
  }
  input[type=text]:focus{border-color:var(--warm);}
  button.send{
    width:42px; height:42px; background:var(--warm); color:#fff;
    border:none; border-radius:50%; font-size:1.05rem; cursor:pointer; flex-shrink:0;
  }
  button.send:hover{background:var(--warm-dark);}

  .overlay{
    display:none;
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:15;
  }
  .overlay.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2264%22%20fill%3D%22%231f6f78%22/%3E%0A%3Crect%20x%3D%2260%22%20y%3D%2228%22%20width%3D%228%22%20height%3D%2218%22%20rx%3D%224%22%20fill%3D%22%23e8f0f1%22/%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2224%22%20r%3D%227%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2232%22%20y%3D%2246%22%20width%3D%2264%22%20height%3D%2250%22%20rx%3D%2216%22%20fill%3D%22%23ffffff%22/%3E%0A%3Ccircle%20cx%3D%2252%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%231f6f78%22/%3E%0A%3Ccircle%20cx%3D%2276%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2246%22%20y%3D%2288%22%20width%3D%2236%22%20height%3D%227%22%20rx%3D%223.5%22%20fill%3D%22%231f6f78%22%20opacity%3D%220.55%22/%3E%0A%3Crect%20x%3D%2220%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3Crect%20x%3D%2298%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3C/svg%3E" alt="Oxibot">
      <div class="name">Oxibot</div>
      <div class="role">Assistente do Representante</div>
    </div>
    <h2>Solicitações</h2>
    <div class="sidebar-list" id="topicsInner"></div>
  </aside>

  <div class="chat-col">
    <header>
      <button class="menu-btn" id="menuBtn" type="button">☰</button>
      <img class="avatar-img" src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2264%22%20fill%3D%22%231f6f78%22/%3E%0A%3Crect%20x%3D%2260%22%20y%3D%2228%22%20width%3D%228%22%20height%3D%2218%22%20rx%3D%224%22%20fill%3D%22%23e8f0f1%22/%3E%0A%3Ccircle%20cx%3D%2264%22%20cy%3D%2224%22%20r%3D%227%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2232%22%20y%3D%2246%22%20width%3D%2264%22%20height%3D%2250%22%20rx%3D%2216%22%20fill%3D%22%23ffffff%22/%3E%0A%3Ccircle%20cx%3D%2252%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%231f6f78%22/%3E%0A%3Ccircle%20cx%3D%2276%22%20cy%3D%2271%22%20r%3D%228%22%20fill%3D%22%23e08e45%22/%3E%0A%3Crect%20x%3D%2246%22%20y%3D%2288%22%20width%3D%2236%22%20height%3D%227%22%20rx%3D%223.5%22%20fill%3D%22%231f6f78%22%20opacity%3D%220.55%22/%3E%0A%3Crect%20x%3D%2220%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3Crect%20x%3D%2298%22%20y%3D%2260%22%20width%3D%2210%22%20height%3D%2222%22%20rx%3D%225%22%20fill%3D%22%23154e55%22/%3E%0A%3C/svg%3E" alt="Oxibot">
      <div class="header-text">
        <h1>Oxibot</h1>
        <div class="status"><span class="dot"></span> Online agora · aqui pra te ajudar</div>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <form id="form">
      <input type="text" id="input" placeholder="Digite sua dúvida..." autocomplete="off">
      <button class="send" type="submit" aria-label="Enviar">➤</button>
    </form>
  </div>
</div>

<script>
/* =========================================================================
   BASE DE CONHECIMENTO — REPRESENTANTES
   -------------------------------------------------------------------------
   Para adicionar uma nova solicitação, copie um bloco { ... } abaixo e edite:
     id        -> identificador único, sem espaço (ex: "novo-processo")
     title     -> título mostrado no menu lateral e na resposta
     keywords  -> palavras/expressões que o representante pode digitar
     html      -> resposta detalhada, em HTML (<ol>, <ul>, <b>, a classe
                  "note" destaca avisos importantes)
     simple    -> uma versão curta, em linguagem simples, usada quando a
                  pessoa diz que não entendeu a explicação detalhada
   Depois de editar, salve o arquivo e recarregue no navegador. Não precisa
   de mais nada — não há servidor nem banco de dados externo.
   ========================================================================= */
const DOC_NOTE = 'Colete a assinatura do cliente, digitalize o documento, envie no grupo de digitalização da loja e anexe no Sankhya.';

const KNOWLEDGE_BASE = [
  {
    id: "locacao",
    title: "Locação",
    category: "Solicitações e Documentos",
    keywords: ["locacao","locação","alugar equipamento","contrato de locacao","contrato de locação",
      "cpap locacao","cpap locação","alugar cpap"],
    simple: "Resumindo: pra locação, você precisa do RG do cliente, comprovante de residência, comprovante de pagamento e foto do equipamento. Descreva os itens certinho no formulário (nome, quantidade, valor) e depois é só baixar o contrato na tela de Contratos e a remessa no Portal de Vendas, buscando pelo nome do cliente.",
    html: `
      <h3>Locação</h3>
      <p><b>Documentos necessários:</b> documento de identidade do cliente, comprovante de residência, comprovante de pagamento e uma foto legível do equipamento a ser locado.</p>
      <h3>Como descrever os itens no formulário</h3>
      <p>Descreva os itens por completo, seguindo este modelo:</p>
      <ul>
        <li>ATIVO – CPAP DreamStation Auto – 1 un – R$ 1.050,00</li>
        <li>ATIVO – Umidificador DreamStation – 1 un – R$ 0,00</li>
        <li>ATIVO – Modem DreamStation – 1 un – R$ 0,00</li>
      </ul>
      <p>Exemplos de número de série:</p>
      <ul>
        <li>J373025344ADF</li>
        <li>H3730331428F7</li>
        <li>CT7385584DE4E</li>
      </ul>
      <div class="note">Se o número de série do equipamento incluir um Device Number (DN), esse dado também deve constar na descrição do equipamento.</div>
      <h3>Depois do envio do formulário</h3>
      <p>O setor de solicitações emitirá o contrato e a remessa.</p>
      <ul>
        <li><b>Para baixar o contrato:</b> na tela de Contratos, digite o nome do cliente, clique em Aplicar e, na seta ao lado da lupa de pesquisa, selecione "Contrato de Locação Fidelização".</li>
        <li><b>Para encontrar a remessa:</b> no Portal de Vendas, digite o nome do cliente no campo Parceiro.</li>
      </ul>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "venda-produto",
    title: "Venda de Produto",
    category: "Solicitações e Documentos",
    keywords: ["venda de produto","vender produto","vender item","vender acessorio","vender acessório",
      "venda de acessorio","venda de acessório"],
    simple: "Resumindo: só precisa do comprovante de pagamento e foto do item vendido. A nota de venda você encontra no Portal de Vendas, buscando pelo nome do cliente.",
    html: `
      <h3>Venda de Produto</h3>
      <p><b>Documentos necessários:</b> comprovante de pagamento e foto do(s) item(ns) vendido(s).</p>
      <h3>Como descrever os itens no formulário</h3>
      <ul>
        <li>Cateter Nasal – 1 un – R$ 35,00</li>
        <li>Copo Umidificador – 2 un – R$ 35,00</li>
      </ul>
      <p>Para encontrar a nota de venda: no Portal de Vendas, digite o nome do cliente no campo Parceiro.</p>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "bonificacao-rep",
    title: "Bonificação",
    category: "Solicitações e Documentos",
    keywords: ["bonificacao","bonificação","item bonificado","bonificar produto"],
    simple: "Resumindo: descreva o motivo da bonificação e tire foto do item bonificado.",
    html: `
      <h3>Bonificação</h3>
      <p><b>Documentos necessários:</b> motivo da bonificação e foto do(s) item(ns) bonificado(s).</p>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "renovacao-rep",
    title: "Renovação",
    category: "Solicitações e Documentos",
    keywords: ["renovacao","renovação","renovacao simples","renovação simples","renovacao upgrade",
      "renovação upgrade","upgrade de plano","fidelidade"],
    simple: "Resumindo: só precisa do comprovante de pagamento. Se o cliente ficar no mesmo plano ou for pra um com fidelidade menor, é renovação simples; se for pra um plano com fidelidade maior, é upgrade. O contrato você baixa na tela de Contratos.",
    html: `
      <h3>Renovação</h3>
      <p><b>Documento necessário:</b> comprovante de pagamento.</p>
      <ul>
        <li><b>Renovação simples:</b> o cliente permanece no mesmo plano ou migra para um plano com fidelidade menor.</li>
        <li><b>Renovação upgrade:</b> o cliente migra para um plano com fidelidade maior.</li>
      </ul>
      <p>Para baixar o contrato: na tela de Contratos, digite o nome do cliente, clique em Aplicar e, na seta ao lado da lupa de pesquisa, selecione "Contrato de Locação Fidelização".</p>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "recolhimento",
    title: "Recolhimento",
    category: "Solicitações e Documentos",
    keywords: ["recolhimento","recolher equipamento","retorno de remessa","ficha de recolhimento"],
    simple: "Resumindo: tire foto do equipamento recolhido e descreva o motivo no formulário. A ficha de recolhimento fica no Portal de Vendas, no documento em vermelho \"Retorno de Remessa de Locação\".",
    html: `
      <h3>Recolhimento</h3>
      <p><b>Documento necessário:</b> foto do equipamento recolhido. Descreva também o motivo do recolhimento no formulário.</p>
      <p>Para baixar a ficha de recolhimento: no Portal de Vendas, digite o nome do cliente e clique em Aplicar. Localize o documento mais recente, destacado em vermelho, com o título "Retorno de Remessa de Locação", selecione-o e clique no ícone ao lado da impressora para gerar a "Ficha de Recolhimento".</p>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "venda-servico-ajuste-cpap",
    title: "Ajuste de CPAP / Relatório",
    category: "Solicitações e Documentos",
    keywords: ["ajuste de cpap","relatorio","relatório","venda de servico","venda de serviço","servico tecnico",
      "serviço técnico","emissao de relatorio","emissão de relatório"],
    simple: "Resumindo: usado pra ajuste de CPAP ou emissão de relatório. Informe o tipo de serviço e o valor no formulário, junto com o comprovante de pagamento. A nota fica no Portal de Vendas.",
    html: `
      <h3>Venda de Serviço — Ajuste de CPAP ou Relatório</h3>
      <p>Use essa opção sempre que for realizar um ajuste no equipamento do cliente ou emitir um relatório.</p>
      <p>No formulário, informe o tipo de serviço e o valor. <b>Documento necessário:</b> comprovante de pagamento.</p>
      <p>O setor de solicitações emitirá, no Portal de Vendas, um "Pedido de Venda Serviço" com o tipo de serviço, nome do cliente e valor. Para localizá-lo, acesse o Portal de Vendas e busque pelo nome do cliente.</p>
      <div class="note">A coordenação também enviará, no seu privado, uma nota de serviço emitida pelo portal da Prefeitura.</div>
      <div class="note">${DOC_NOTE}</div>
    `
  },
  {
    id: "venda-encomenda",
    title: "Venda por Encomenda",
    category: "Solicitações e Documentos",
    keywords: ["venda por encomenda","retirada de equipamento","venda retirada","retirar equipamento"],
    simple: "Resumindo: precisa do comprovante de pagamento e foto do equipamento retirado. A nota fica no Portal de Vendas.",
    html: `

/* ========================= DETECÇÃO DE INTENÇÃO ========================= */
const CONFUSION_PATTERNS = [
  "nao entendi","não entendi","nao entendo","não entendo","nao ficou claro","não ficou claro",
  "explica de outro jeito","explica diferente","de outra forma","mais simples","nao captei",
  "não captei","confuso","complicado","nao saquei","não saquei","resume","resumindo",
  "pode simplificar","fica dificil","fica difícil","nao entendi nada","não entendi nada"
];
const GREETING_PATTERNS = ["oi","ola","olá","bom dia","boa tarde","boa noite","opa","eae","e ai","e aí"];
const THANKS_PATTERNS = ["obrigado","obrigada","valeu","vlw","top obrigado","ajudou","show"];
const ONLY_THIS_PATTERNS = ["so isso","só isso","e so isso","é só isso","isso mesmo","so isso mesmo",
  "só isso mesmo","é isso","e isso","era so isso","era só isso","nada mais","so isso ai","só isso aí"];

/* Variações de resposta, pra soar mais natural e menos repetitivo */
const GREETING_REPLIES = [

  "Olá! Fico por aqui pra ajudar com as solicitações do dia a dia. Pode perguntar à vontade.",

  "Disponha! Qualquer outra dúvida, é só chamar.",
  "Fico feliz em ajudar! Se precisar de mais alguma coisa, estou por aqui.",
  "Por nada! Sempre que precisar, é só perguntar."
];
const ONLY_THIS_REPLIES = [
  "Sim, é isso mesmo! 😊 Posso ajudar com mais alguma coisa?",
  "Isso aí, era só isso mesmo! Precisa de algo mais?",
  "Exatamente! Se surgir outra dúvida, é só chamar."
];
const MISS_INTROS = [
  "Ainda não tenho essa informação na minha base 🙁",

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/\s+/g," ").trim();
}
function matchesAny(qNorm, list){
  return list.some(p => qNorm.includes(normalize(p)));
}
function scoreEntry(entry, queryNorm){
  let score = 0;
  for(const kw of entry.keywords){
    const kwNorm = normalize(kw);
    if(!kwNorm) continue;
    if(queryNorm.includes(kwNorm)){
      score += kwNorm.split(" ").length * 3;
    } else {
      const words = kwNorm.split(" ");
      const hits = words.filter(w => w.length > 2 && queryNorm.includes(w)).length;
      score += hits;
    }
  }
  const titleNorm = normalize(entry.title);
  titleNorm.split(" ").forEach(w=>{ if(w.length>3 && queryNorm.includes(w)) score += 1; });
  return score;
}
function findAnswer(query){
  const qNorm = normalize(query);
  let best = null, bestScore = 0;
  for(const entry of KNOWLEDGE_BASE){
    const s = scoreEntry(entry, qNorm);
    if(s > bestScore){ bestScore = s; best = entry; }
  }
  return bestScore >= 2 ? best : null;
}

/* ========================= ESTADO ========================= */
let lastEntry = null;
const AVATAR_DATA = document.querySelector(".avatar-img").src;

/* ========================= INTERFACE ========================= */
const messagesEl = document.getElementById("messages");
const formEl = document.getElementById("form");
const inputEl = document.getElementById("input");
const topicsInner = document.getElementById("topicsInner");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");

menuBtn.addEventListener("click", ()=>{ sidebar.classList.add("open"); overlay.classList.add("show"); });
overlay.addEventListener("click", ()=>{ sidebar.classList.remove("open"); overlay.classList.remove("show"); });

function renderTopics(){
  const categories = new Map();
  KNOWLEDGE_BASE.forEach(entry=>{
    const cat = entry.category || "Solicitações e Documentos";
    if(!categories.has(cat)) categories.set(cat, []);
    categories.get(cat).push(entry);
  });

  categories.forEach((entries, cat)=>{
    const h = document.createElement("h2");
    h.textContent = cat;
    topicsInner.appendChild(h);

    entries.forEach(entry=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "side-btn";
      b.textContent = entry.title;
      b.onclick = ()=>{ sidebar.classList.remove("open"); overlay.classList.remove("show"); ask(entry.title); };
      topicsInner.appendChild(b);
    });
  });
}
renderTopics();

function scrollDown(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

function timeNow(){
  const d = new Date();
  return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
}

function addUserMsg(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble-wrap">
      <div class="bubble"></div>
      <div class="timestamp">${timeNow()}</div>
    </div>`;
  row.querySelector(".bubble").textContent = text;
  messagesEl.appendChild(row);
  scrollDown();
}

function addBotBubble(innerHtml, kind){
  const row = document.createElement("div");
  row.className = "row " + (kind || "bot");
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot">
    <div class="bubble-wrap">
      <div class="bubble">${innerHtml}</div>
      <div class="timestamp">Oxibot · ${timeNow()}</div>
    </div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function greetingReply(){ addBotBubble(pick(GREETING_REPLIES)); }
function thanksReply(){ addBotBubble(pick(THANKS_REPLIES)); }
function onlyThisReply(){ addBotBubble(pick(ONLY_THIS_REPLIES)); }

function confusionReply(){
  if(lastEntry){
    addBotBubble(`<span class="rephrase-tag">Explicando de outro jeito</span><br>${lastEntry.simple}`);
  } else {
    addBotBubble("Sem problema! Me diz qual solicitação você quer entender (ex: locação, venda, recolhimento) que eu explico com calma. Também dá pra abrir a lista de solicitações no menu ☰.");
  }
}

function missReply(query){
  const row = document.createElement("div");
  row.className = "row miss";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot">
    <div class="bubble-wrap">
      <div class="bubble">Hmm, essa solicitação ainda não está cadastrada comigo. 🙁<br>
        Peça pra Pollyanna incluir essa informação na minha base.</div>
      <div class="timestamp">Oxibot · ${timeNow()}</div>
    </div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row bot typing-row";
  row.innerHTML = `<img class="mini-avatar" src="${AVATAR_DATA}" alt="Oxibot">
    <div class="bubble-wrap"><div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
  messagesEl.appendChild(row);
  scrollDown();
  return row;
}

function ask(query){
  if(!query.trim()) return;
  addUserMsg(query);
  inputEl.value = "";

  const qNorm = normalize(query);
  const typingRow = showTyping();

  setTimeout(()=>{
    typingRow.remove();
    if(matchesAny(qNorm, GREETING_PATTERNS) && qNorm.split(" ").length <= 4){ greetingReply(); return; }
    if(matchesAny(qNorm, THANKS_PATTERNS)){ thanksReply(); return; }
    if(matchesAny(qNorm, ONLY_THIS_PATTERNS) && qNorm.split(" ").length <= 5){ onlyThisReply(); return; }
    if(matchesAny(qNorm, CONFUSION_PATTERNS)){ confusionReply(); return; }

    const match = findAnswer(query);
    if(match){ lastEntry = match; addBotBubble(match.html); }
    else{ missReply(query); }
  }, 450);
}

formEl.addEventListener("submit", e=>{ e.preventDefault(); ask(inputEl.value); });

greetingReply();
</script>
